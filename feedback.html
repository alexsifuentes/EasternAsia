               <!-- Title -->
    <section id="title">
        <div class="container">
          <h2 class="text-center">Eastern Asia Tips and Info</h2>
        </div>
        <img src="img/Flag_of_Japan_and_South_Korea.jpg.png" alt="South Korea and Japan flag" class="flag">
        </section>


    <section id="question">
        <div class="container">
            <form method="post" id="questions">
                <fieldset id="feedbackInformation">
                    <legend>Have Questions About A Certain Country in Eastern Asia?</legend>
                    <label>Name</label>
                    <input type="text" name="name" id="Name" placeholder="Full Name" required />
                    <label>Email Address</label>
                    <input type="email" name="contact_email" id="contactEmail" placeholder="email@example.com" required />
                    <label>Which Country Are You Visiting?</label>
                    <input type="text" name="country" id="country" list="countryList" placeholder="Japan" required />
                    <datalist id="countryList">
                        <option value="Japan" />
                        <option value="South Korea" />
                        <option value="China" />
                        <option value="Taiwan" />
                    </datalist>
                    <label>Type Your Questions Here</label>
                    <textarea id="message" name="message" placeholder="Write something here" style="width: 750px;"></textarea>
                </fieldset>
                <button type="submit" id="submitButton">Submit</button>
            </form>
        </div>
    </section>

    <section id="feedback">
        <div class="container">
            <form method="post" id="feedback">
                <fieldset id="feedbackInformation">
                    <legend>We'd Welcome Your Feedback!</legend>
                    <label>Name</label>
                    <input type="text" name="name" id="Name" placeholder="Full Name" required />
                    <label>Email Address</label>
                    <input type="email" name="contact_email" id="contactEmail" placeholder="email@example.com" required />
                    <label>Write Your Feedback Here</label>
                    <textarea id="message" name="message" placeholder="Write something here" style="width: 750px;"></textarea>
                </fieldset>
                <button type="submit" id="submitButton">Submit</button>
            </form>
        </div>
    </section>
